name: gates

# Gates de qualidade do PicSaúde: unitários (sem DB) + integração (PostgreSQL real).
# Habilita verificação reproduzível na nuvem (não depende do colima local) e a
# regra de "merge só com gate verde". O Postgres vem como service container.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: picsaude
          POSTGRES_PASSWORD: picsaude
          POSTGRES_DB: picsaude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picsaude -d picsaude_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Gates unitários (sem DB)
        working-directory: backend
        run: python -m pytest tests/unit -q

      - name: Gates de integração (PostgreSQL)
        working-directory: backend
        env:
          # 'test' no nome satisfaz o guardrail do conftest de integração.
          DATABASE_URL: postgresql://picsaude:picsaude@localhost:5432/picsaude_test
        # --ignore: test_concorrencia.py tem import quebrado pré-existente
        #   (DATABASE_URL_TEST ausente no conftest) que trava a coleção da pasta.
        # -k: roda só as suítes-gate verdes (ownership + institucional), evitando
        #   suítes de integração ainda não validadas neste schema.
        # test_custodia_devolucao: adicionado no T1 (PLANO_DEMO_CIRCULACAO.md) —
        #   estava implementado (TICKET-4E-2) mas nunca rodava neste gate.
        run: >-
          python -m pytest tests/integration
          --ignore=tests/integration/test_concorrencia.py
          -k "autorizacao or institucional or test_pedidos_exame or importar_cnes or test_custodia_devolucao"
          -q
