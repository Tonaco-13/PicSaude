name: gates

# Gates de qualidade do PicSaúde: unitários (sem DB) + integração (PostgreSQL real).
# Habilita verificação reproduzível na nuvem (não depende do colima local) e a
# regra de "merge só com gate verde". O Postgres vem como service container.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # TICKET-CORE-R2 §3.2 (§2a R2) — o guard-rail de unicidade de identificadores
    # roda NIGHTLY além de em todo PR. O gate já roda em todo PR (superset de "PR
    # que toca dispensacoes/estornos/prescricao_itens"); o nightly captura
    # duplicidade introduzida por migração ou data-fix, não só por código de PR.
    - cron: "0 6 * * *"   # 06:00 UTC, diário

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: picsaude
          POSTGRES_PASSWORD: picsaude
          POSTGRES_DB: picsaude_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picsaude -d picsaude_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Gates unitários (sem DB)
        working-directory: backend
        run: python -m pytest tests/unit -q

      # ── ENG-017 (A1/A2) — O GATE DEIXA DE SER CEGO AO FUSO ──────────────
      #
      # O runner roda em UTC, onde `date.today()` e o dia UTC coincidem. Por
      # isso o CI NUNCA viu o A1: a janela dos relatórios fechava em meia-noite
      # LOCAL contra registros carimbados em UTC, e no fuso −03 tudo o que
      # nascesse entre 21h e 24h caía fora. Um defeito real de produção ficou
      # invisível por escolha de fuso do runner — e é a SEGUNDA vez que esta
      # família aparece (a primeira foi o "500 do faturamento por fuso").
      #
      # Este passo roda os testes sensíveis a relógio no fuso onde o defeito
      # aparece. É defesa em profundidade, não a guarda principal: entre 00h e
      # 21h UTC, Recife e UTC caem no mesmo dia e o passo passaria dos dois
      # jeitos. A guarda que vale a qualquer hora é a REPRODUÇÃO ARITMÉTICA em
      # `tests/unit/test_janela_relatorio_utc.py`, que não depende de quando a
      # suíte roda.
      #
      # Fuso do Fabiano de propósito: é onde a vitrine é operada.
      - name: Gate de fuso — janela de relatório em TZ=America/Recife (ENG-017 A2)
        working-directory: backend
        env:
          TZ: America/Recife
          DATABASE_URL: postgresql://picsaude:picsaude@localhost:5432/picsaude_test
        run: |
          date
          python -c "from datetime import datetime, timezone; import time; print('local', datetime.now().date(), '| utc', datetime.now(timezone.utc).date())"
          python -m pytest tests/unit/test_janela_relatorio_utc.py -q
          python -m pytest tests/integration/test_relatorio_sngpc.py \
                           tests/integration/test_relatorio_exames_clinica.py \
                           tests/integration/test_faturamento_exames_clinica.py \
                           tests/integration/test_historico_clinica.py -q

      - name: Gates de integração (PostgreSQL)
        working-directory: backend
        env:
          # 'test' no nome satisfaz o guardrail do conftest de integração.
          DATABASE_URL: postgresql://picsaude:picsaude@localhost:5432/picsaude_test
        # --ignore: test_concorrencia.py tem import quebrado pré-existente
        #   (DATABASE_URL_TEST ausente no conftest) que trava a coleção da pasta.
        # -k: roda só as suítes-gate verdes (ownership + institucional), evitando
        #   suítes de integração ainda não validadas neste schema.
        # test_custodia_devolucao: adicionado no T1 (PLANO_DEMO_CIRCULACAO.md) —
        #   estava implementado (TICKET-4E-2) mas nunca rodava neste gate.
        #   Cobre também B1 (dispensacao_id + comprovante) — mesma suíte.
        # fila: T4 (PLANO_DEMO_CIRCULACAO §5) — casa test_fila_dispensador.
        # relatorio: T8 — escopo por CNPJ do dispensador (test_relatorio_escopo_dispensador).
        # idempotencia/unicidade: TICKET-CORE-R2 — concorrência (FOR UPDATE) +
        #   guard-rail de unicidade de identificadores no relatório.
        # faturamento: ENG-009 (R4). Mesmo motivo do `catalogo` abaixo — sem o termo,
        #   test_faturamento_exames_clinica.py fica VERDE E NÃO GATEADO (conferido:
        #   o CI do PR #143 deselecionou os 7 testes). Verde e não gateado apodrece.
        # catalogo: TASK 2 (autorizado pelo Revisor no PR #138, arquiteto em cópia).
        #   test_catalogo_regulatorio.py ficou VERMELHO por muito tempo justamente
        #   por estar fora deste filtro — ninguém via. Consertá-lo (fixture do
        #   catálogo no conftest) sem gateá-lo convidaria o apodrecimento de volta:
        #   verde e não gateado apodrece. Agora qualifica no critério do próprio
        #   filtro ("suítes-gate verdes") — 23 testes, todos verdes contra PG.
        # ── Família de INVARIANTE/LEDGER (parecer do Arquiteto 2026-08-13 §4.2) ──
        # test_4d1/test_4d2 (instance_id no ledger), test_4e_e2e (E2E consolidado),
        #   integridade (FK pendurada, evento sem prescrição, prescrição sem ledger),
        #   transferencia_exame (custódia nível-pedido paciente→CNPJ + ledger).
        # Motivo: o `test_4d2` passou meses VERMELHO sem ninguém ver, porque não
        #   casava com nenhum termo daqui. É a mesma lição do `catalogo` acima, um
        #   grau pior: verde e não gateado apodrece; VERMELHO e não gateado mente.
        #   Suíte que afirma invariante é justamente a que não pode ficar fora.
        # Varredura feita na mesma sessão: as 5 estavam verdes contra PG ao entrar.
        #   Fora ficou `test_regras_receituario.py` — vermelho PRÉ-EXISTENTE por
        #   data fixa (validade 2026-05-26 vs. utcnow), não por invariante. Gatear
        #   suíte vermelha só transferiria o apodrecimento para o CI.
        # regras_receituario: ENTROU em 2026-08-13 (TICKET-I.5). A data fixa virou
        #   relativa (`utcnow() + 30 dias`), então a suíte não vence mais sozinha —
        #   deixou de ser bomba-relógio e passou a qualificar no critério do filtro
        #   ("suítes-gate verdes"). Era a última exceção nomeada aqui.
        run: >-
          python -m pytest tests/integration
          --ignore=tests/integration/test_concorrencia.py
          -k "autorizacao or institucional or test_pedidos_exame or importar_cnes or test_custodia_devolucao or fila or relatorio or estorno or comprador or historico or idempotencia or unicidade or b0 or acionavel or comprovante or catalogo or faturamento or test_4d1 or test_4d2 or test_4e_e2e or integridade or transferencia_exame or regras_receituario"
          -q

      - name: Gate do ledger imutável (SQLite + PostgreSQL)
        # TICKET-LEDGER-TRIGGERS-MIGRACAO. Prova que o banco RECUSA UPDATE/DELETE
        # nas 8 tabelas de ledger (CLAUDE.md §2) nos DOIS dialetos, com a mesma
        # mensagem. Passo próprio porque a suíte é parametrizada por dialeto: os
        # casos SQLite montam um banco temporário com `alembic upgrade head`, e os
        # casos PostgreSQL usam o service container — é o PG que prova o
        # invariante onde a produção vai rodar. Antes deste ticket o teste era
        # SQLite-only e ficava verde enquanto a PG não tinha trigger nenhum.
        working-directory: backend
        env:
          DATABASE_URL: postgresql://picsaude:picsaude@localhost:5432/picsaude_test
        run: python -m pytest tests/test_ledger_imutabilidade.py -q

      - name: Gate do reset demo (PostgreSQL) — TICKET-DEMO-RESET-PG
        # Prova executável dos ACs 4/5/6/9 contra PG real (o gate que faltava):
        #   AC4 — rebuild limpo deixa alembic head + 17 triggers + personas.
        #   AC5 — vermelho-antes-de-verde: artefato de sessão injetado SOME.
        #   AC6 — idempotente (rodar 2× = mesmo estado).
        #   AC9 — job cego (sem --sim-eu-quero, stdin fechado) aborta ANTES de
        #         qualquer DROP, mesmo com PICSAUDE_ENV=stg + DEMO_MODE=true.
        # A suíte cria um banco DESCARTÁVEL (picsaude_test_resetself) na mesma
        # cluster e o dropa no teardown — o DROP SCHEMA acontece dentro dele,
        # nunca no picsaude_test compartilhado. Mesmo padrão do "Gate do ledger
        # imutável" acima: passo dedicado com DATABASE_URL de PG.
        working-directory: backend
        env:
          DATABASE_URL: postgresql://picsaude:picsaude@localhost:5432/picsaude_test
        run: python -m pytest tests/integration/test_reset_demo_db_pg.py -q

      - name: Predeploy smoke — o que o Render roda (migrations + seed idempotente)
        # Fecha o gap que deixou o deploy #84 quebrar: o gate rodava as migrations
        # mas NUNCA o `seed_demo.py`, que o predeploy roda contra a PG de prod (set -e).
        # Aqui replicamos o preDeployCommand num DB dedicado e re-seedamos (o deploy
        # re-roda o seed a cada push → tem que ser idempotente). Sem isto, um INSERT
        # que quebra só na PG (ex.: RETURNING id em tabela sem `id`) passa despercebido.
        working-directory: backend
        env:
          DATABASE_URL: postgresql://picsaude:picsaude@localhost:5432/picsaude_predeploy
          PICSAUDE_ENV: stg
          PICSAUDE_DEMO_MODE: "true"
        run: |
          python -c "import psycopg2; c=psycopg2.connect('postgresql://picsaude:picsaude@localhost:5432/postgres'); c.autocommit=True; k=c.cursor(); k.execute('DROP DATABASE IF EXISTS picsaude_predeploy'); k.execute('CREATE DATABASE picsaude_predeploy')"
          sh predeploy.sh
          echo "[smoke] re-seed (idempotência — o deploy re-roda a cada push)"
          python3 seed_demo.py
          echo "[smoke] catálogo regulatório na PG que o predeploy acabou de semear"
          # DESPACHO-OPS-SEED-CATALOGO-DCB — a guarda em tests/test_seed_catalogo_dcb.py
          # roda em SQLite; estas duas linhas conferem os MESMOS invariantes no
          # dialeto e no caminho da vitrine (predeploy → PG), onde o vazio doeu.
          python -c "import os, psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); k=c.cursor(); k.execute('SELECT COUNT(*) FROM catalogo_substancias'); n=k.fetchone()[0]; print(f'[smoke] catalogo_substancias={n}'); raise SystemExit(0 if n > 0 else 'catalogo_substancias VAZIA apos o predeploy — seeder orfao (ver seed_demo._garantir_catalogo_regulatorio)')"
          # Aperto do Revisor (parecer no #137): tornar contínuo na PG o no-duplicate
          # que só o SQLite gateava — doutrina do R2 (invariante executável, não
          # memória de revisor).
          # Achado ao implementar: a unicidade já é ESTRUTURAL nos DOIS dialetos —
          # `uq_catalogo_dcb_normalizada`, criada pela migração 0c8654f77baf. Um
          # UPSERT quebrado não produz linha duplicada: estoura IntegrityError
          # DENTRO do `seed_demo.py` e o `set -e` do predeploy já aborta o deploy.
          # Esta linha fica, então, como TRIPWIRE da constraint: o dia em que uma
          # migração futura a derrubar, é aqui que aparece — antes da vitrine.
          python -c "import os, psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); k=c.cursor(); k.execute('SELECT dcb_normalizada FROM catalogo_substancias GROUP BY dcb_normalizada HAVING COUNT(*) > 1'); d=[r[0] for r in k.fetchall()]; print(f'[smoke] DCBs duplicadas={len(d)}'); raise SystemExit(0 if not d else f'catalogo_substancias com DCB duplicada apos 2 seeds: {d[:5]} — UPSERT por dcb_normalizada nao segurou na PG')"
          echo "[smoke] objetos-demo na PG — o incidente da vitrine de 20/08"
          # Os blocos de objetos-demo do seed são best-effort (try/except + rollback
          # + aviso): uma falha ali NÃO derruba o deploy, por decisão. O efeito
          # colateral é que o seed sai 0 SEM o objeto — foi assim que a vitrine de
          # 20/08 ficou sem o laudo-demo (duplicate key em
          # uq_custodia_exame_ativa_pedido_item_pg, custódia aberta à mão sem fechar
          # a anterior). Best-effort no DEPLOY é resiliência; no GATE é cegueira.
          # A guarda em tests/test_seed_objetos_demo.py roda em SQLite; estas duas
          # linhas conferem os MESMOS invariantes na PG, que é o dialeto onde doeu.
          python -c "import os, psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); k=c.cursor(); k.execute(\"SELECT protocolo FROM pedidos_exame WHERE protocolo IN ('DEMO-EXAME-0001','DEMO-EXAME-0002')\"); p=sorted(r[0] for r in k.fetchall()); k.execute(\"SELECT protocolo FROM laudos WHERE protocolo = 'DEMO-LAUDO-0001'\"); l=[r[0] for r in k.fetchall()]; print(f'[smoke] objetos-demo: pedidos={p} laudo={l}'); falta=[x for x in ('DEMO-EXAME-0001','DEMO-EXAME-0002') if x not in p] + ([] if l else ['DEMO-LAUDO-0001']); raise SystemExit(0 if not falta else f'objeto-demo AUSENTE apos o predeploy: {falta} — o bloco best-effort engoliu o erro e o seed saiu 0 sem o objeto (ver seed_demo._garantir_laudo_demo)')"
          python -c "import os, psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); k=c.cursor(); k.execute('SELECT pedido_id, COALESCE(item_id,-1), COUNT(*) FROM pedido_exame_custodia WHERE encerrada_em IS NULL GROUP BY 1,2 HAVING COUNT(*) > 1'); d=k.fetchall(); print(f'[smoke] duplas posses ativas={len(d)}'); raise SystemExit(0 if not d else f'DUPLA POSSE ativa apos o seed: {d[:5]} — o R2 na camada de custodia; toda escrita deve passar por transferir_posse_exame')"
          # ENG-014 (v2) — o laudo-demo tem de nascer COM o elo `pedido_item_id`,
          # e o elo tem de apontar para item DO PEDIDO vinculado. Sem isso ele
          # nasce LEGADO a cada reset e cai na ponte §2.2 — que existe para o
          # histórico de verdade, não para objeto novo. A guarda em SQLite está
          # em tests/test_seed_objetos_demo.py; esta linha confere na PG, que é
          # o caminho da vitrine.
          python -c "import os, psycopg2; c=psycopg2.connect(os.environ['DATABASE_URL']); k=c.cursor(); k.execute(\"SELECT li.pedido_item_id, (SELECT pedido_id FROM pedido_exame_itens WHERE id = li.pedido_item_id) = l.pedido_id FROM laudo_itens li JOIN laudos l ON l.id = li.laudo_id WHERE l.protocolo = 'DEMO-LAUDO-0001'\"); r=k.fetchall(); print(f'[smoke] elo do laudo-demo={r}'); ruim=[x for x in r if x[0] is None or not x[1]]; raise SystemExit(0 if r and not ruim else f'laudo-demo SEM elo coerente: {r} — nasceu legado e cai na ponte 2.2 (ver seed_demo._garantir_laudo_demo)')"

      # ── PARIDADE DE DEPLOY — "gate verde, deploy cego" (incidente de 24/08) ──
      #
      # Todo o resto deste gate serve o REPOSITÓRIO. A vitrine serve a IMAGEM.
      # Enquanto o Dockerfile copiava lista explícita, asset novo entrava no
      # repo, passava em tudo — inclusive nos testes de navegador, que abrem as
      # telas de verdade — e não existia em produção. Três estavam 404 quando o
      # incidente estourou: `lente.js` (#167), `catalogos-encaminhamento.js`
      # (#187) e `submodulos.*` (#193). Os dois primeiros falhavam em SILÊNCIO
      # havia meses; só o terceiro derrubou o login e foi notado.
      #
      # `tests/test_paridade_deploy_assets.py` prova a REGRA de graça, lendo o
      # Dockerfile. Este passo prova o FATO: builda a imagem e confere que os
      # arquivos ESTÃO lá dentro — pega o que um parser não sabe ler (um
      # `.dockerignore` novo, mudança de estágio, destino diferente).
      - name: Gate de paridade de deploy — os assets estão na IMAGEM
        run: |
          set -euo pipefail
          docker build -t picsaude-paridade:ci .
          echo "— assets referenciados pelas telas —"
          # woff2 entrou no flip da abertura (30/08) — as fontes self-hosted
          # de index.html (`fonts/*.woff2`) são o primeiro asset em subpasta.
          ASSETS=$(grep -ohE '(src|href)="[^"]+\.(js|css|png|svg|ico|woff2)"' *.html \
                   | sed 's/.*="//;s/"//' | grep -v '^https\?://' | sort -u)
          echo "$ASSETS"
          # `while read` em vez de `for a in $ASSETS`: o `for` depende de word
          # splitting de variável não-aspeada, que é comportamento de bash e não
          # de todo shell. Ler linha a linha funciona igual em qualquer um — e
          # esta guarda existe justamente porque uma diferença de ambiente
          # passou despercebida.
          FALTA=""
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            if ! docker run --rm --entrypoint sh picsaude-paridade:ci \
                 -c "test -f /app/frontend/$a"; then
              FALTA="$FALTA $a"
            fi
          done <<< "$ASSETS"
          if [ -n "$FALTA" ]; then
            echo "::error::assets 404 na imagem (deploy cego):$FALTA"
            exit 1
          fi
          echo "[paridade] todos os assets referenciados existem em /app/frontend"

      - name: Gate do seed do catálogo DCB — DESPACHO-OPS-SEED-CATALOGO-DCB
        # Guarda contra o "seeder órfão": `catalogo_seed.py` (56 DCBs) existia
        # desde o Ticket 20 mas ninguém o chamava, e a tabela nascia vazia em todo
        # ambiente — motor RDC 1.000/2025 cego, /catalogo/substancias vazio.
        # Passo próprio (como o gate do ledger): a suíte monta um banco demo
        # efêmero com a receita do predeploy (alembic upgrade head + seed_demo.py)
        # e prova, pela mesma função que `receituarios.py` chama, que o motor
        # enxerga o CLONAZEPAM (B1). Não usa PG: o invariante é do seed, não do
        # dialeto — e a linha acima já o confere na PG do predeploy.
        working-directory: backend
        run: python -m pytest tests/test_seed_catalogo_dcb.py -q
