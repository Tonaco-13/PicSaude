name: gates-browser

# ─────────────────────────────────────────────────────────────────────────────
# TICKET-GATE-BROWSER — segunda camada do gate de frontend (opção C, híbrido).
#
# POR QUE SEPARADO DO gates.yml
# O defeito do #103 (seletor de conselho vazio por temporal dead zone) só nasce
# em PR que toca a tela. Rodar um navegador num PR de ledger é pagar por nada.
#
#   Guardas estáticas (tests/unit/test_frontend_atestado.py) → TODO PR, rápidas.
#   Smokes de navegador (tests/browser/)                     → só PR de *.html.
#
# Estático é a primeira linha; navegador é a segunda, onde o estático é cego —
# ele confere a ORDEM do código, não o RESULTADO na tela.
#
# POR QUE PLAYWRIGHT-PYTHON
# A aplicação é Python: não há node_modules nem dependência de Node no gate.
# (Há um package.json na raiz, mas é só um atalho de conveniência para subir o
# preview local — nada no CI o lê.) pytest-playwright roda dentro do pytest que
# já existe e traz o próprio Chromium (não depende de Chrome no runner).
# Puppeteer/Cypress trariam uma toolchain Node inteira.
#
# O banco demo do smoke nasce na fixture (tests/browser/conftest.py), pela mesma
# receita que reconstrói o demo de verdade: PICSAUDE_DEMO_MODE=true + alembic
# upgrade head + seed_demo.py. Desde que a dívida #98 foi paga, o Alembic honra
# PICSAUDE_DEMO_MODE — não há mais contorno manual a documentar aqui, e o CI
# continua PROVANDO que a receita funciona.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - '**.html'
      # O harness e as próprias dependências do gate também disparam: um PR que
      # mexe no conftest/smokes precisa provar que eles ainda rodam.
      - 'backend/tests/browser/**'
      - 'requirements-browser.txt'
      - '.github/workflows/gates-browser.yml'
      # O seed é o fornecedor dos dados que o smoke da fila audita (item
      # controlado + unidade). Quebrou o seed, quebrou o smoke.
      - 'backend/seed_demo.py'
      # ── Backend que decide o que a tela mostra (lição do #152/#155) ──────
      # O #152 mudou a custódia (estorno total devolve a posse ao cidadão) sem
      # tocar em nenhum .html. Nenhum path casou, o gate não rodou, e a quebra
      # dos smokes ficou SEIS HORAS invisível — entre dois nightlies. Quando
      # apareceu, foi no colo de um PR de frontend alheio (#154), que levou a
      # culpa por herança e por pouco não gerou um "fix" no lugar errado.
      #
      # Router e máquina de estados são exatamente onde nasce a divergência
      # entre o que o backend faz e o que a tela afirma — é o defeito que o
      # smoke existe para pegar. O filtro por path é economia; economia que
      # deixa o gate cego no ponto de maior risco não é economia, é dívida.
      # ~3 min de runner por PR de backend é o preço, e é barato perto de um
      # diagnóstico errado.
      #
      # Deliberadamente ABRANGENTE (`routers/**`, não uma lista de routers de
      # tela): lista nomeada envelhece em silêncio e reabre o mesmo buraco no
      # dia em que alguém criar um router novo.
      - 'backend/app/routers/**'
      - 'backend/app/domain/states*.py'
  schedule:
    # 06:20 UTC — 20 min depois do gate principal, para não disputar runner.
    # O nightly pega o que o filtro de paths não pega. Ele continua sendo a
    # rede de baixo mesmo depois de router e states entrarem nos paths: sobra
    # o resto de `domain/` (ex.: /config/public parar de servir os conselhos
    # deixaria o seletor vazio sem tocar em nenhum .html), catálogo, migração e
    # deriva de ambiente. O que os paths fizeram foi encurtar a janela de
    # descoberta no caso mais provável — não substituir a varredura.
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: gates-browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest -r requirements-browser.txt

      - name: Instalar Chromium do Playwright
        # --with-deps traz as libs de sistema que o Chromium headless exige no
        # ubuntu-latest. Só o Chromium: um navegador basta para um smoke.
        run: python -m playwright install --with-deps chromium

      - name: Smokes de navegador
        working-directory: backend
        # O app de demo (SQLite efêmero + uvicorn) sobe dentro do conftest da
        # pasta — sem serviço externo. Ver tests/browser/conftest.py.
        run: python -m pytest tests/browser -q

      - name: Publicar rastro de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smokes-browser-falha
          path: |
            backend/test-results/
          if-no-files-found: ignore
          retention-days: 7
