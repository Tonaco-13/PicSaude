[pytest]
pythonpath = .
testpaths = tests
# `external` é OPT-IN: quem não pedir, não roda. A fixture `demo_externa_viva`
# pula quando a demo está fora do ar, mas isso protege do FALSO VERMELHO — não
# do efeito colateral. Os testes externos ESCREVEM na demo pública
# (test_f5_externo_picsaude.py, "CONTRATO DE ESCRITA NA DEMO"), e um gate de CI
# não pode criar objeto sanitário numa vitrine só porque a rede estava boa.
# Rodar contra picsaude.com.br passa a exigir `-m external` explícito — que é
# como o próprio arquivo já documentava o uso.
addopts = -m "not external"
markers =
    external: alvo é uma URL externa (demo pública em picsaude.com.br) — pula offline
